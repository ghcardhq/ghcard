# Pushing a tag like v0.2.0 publishes the package to npm. The tag must match
# the version in package.json.
#
# Publishing uses npm trusted publishing: npm trusts this workflow file in
# ghcardhq/ghcard through GitHub's OIDC token, so no npm token is stored here,
# and npm adds provenance automatically. The trusted publisher is configured on
# npmjs.com (package settings), naming this repository and `release.yml`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or later).
      # No dependency cache: a release builds from a clean install.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Build first: npm reads `bin` before prepublishOnly runs, and drops it
      # from the published manifest when dist/cli.js does not exist yet.
      - run: npm run build
      - run: npm --version
      # Verbose so a failed OIDC exchange says why; npm redacts tokens.
      - run: npm publish --access public --loglevel verbose
