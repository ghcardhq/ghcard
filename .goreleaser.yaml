version: 2

project_name: ghcard

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ghcard
    main: ./cmd/ghcard
    binary: ghcard
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Cactusinhand/ghcard/internal/cmd.Version={{.Version}}

archives:
  - id: ghcard
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name, so releases/latest/download/<name> is stable.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - skill/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
